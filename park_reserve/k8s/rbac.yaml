apiVersion: v1
kind: ServiceAccount
metadata:
  name: park-reserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: park-reserve-dates
rules:
  # create cannot be limited by resourceName (the name is unknown at authz time),
  # so it gets its own unrestricted rule; everything else is pinned to the one ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["park-reserve-dates"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: park-reserve-dates
subjects:
  - kind: ServiceAccount
    name: park-reserve
roleRef:
  kind: Role
  name: park-reserve-dates
  apiGroup: rbac.authorization.k8s.io
