apiVersion: v1
kind: Secret
metadata:
  name: park-reserve-secret
type: Opaque
stringData:
  PARK_RESERVE_SSH_TARGET: "cozy@mac"
  PARK_TARGET_URL: "https://uservice.lgcns.com/LGCNS.SV.MAIN/Frame/MainFrame.aspx?menuId=SVREQ1801"
  CNS_ID: "replace-me"
  CNS_PW: "replace-me"
  PARK_CAR_NO: "replace-me"
  PARK_FUEL_VALUE: "24001"
  PARK_REASON: "평일출근"
  PARK_DAYS_AHEAD: "14"
  PARK_TIMEZONE: "Asia/Seoul"
  DISCORD_TOKEN: "replace-me"
  PARK_DISCORD_CHANNEL: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: park-reserve-ssh
type: Opaque
stringData:
  # Private key that can authenticate as cozy@mac.
  # This must be the full private key, not the .pub public key and not the Mac host key.
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    replace-me
    -----END OPENSSH PRIVATE KEY-----

  # Mac host key, used to verify that the SSH target is really mac.
  # Generate with: ssh-keyscan -T 5 your_host
  known_hosts: |
    your_host ssh-ed25519 replace-me

  config: |
    Host your_host
      HostName your_host
      User your_user_name
      IdentityFile /root/.ssh/id_ed25519
      UserKnownHostsFile /root/.ssh/known_hosts
      StrictHostKeyChecking yes
      IdentitiesOnly yes
